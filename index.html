        //Variables
        let numeroSecreto = generarNumeroSecreto();
        let intentos = 0;

        function generarNumeroSecreto() {
           return Math.floor(Math.random()*10)+1;
        }
        //Función que revisar el número que escribió el usuuario
        function adivinar() {
            let numeroUsuario = document.getElementById('inputUsuario').value;
            // convertimos de texto a número
            numeroUsuario = parseInt(numeroUsuario);
            //sumamos un intento cada vez que el usuario adivina
            intentos = intentos + 1;
            //Comparamos el número del usuario con el número secreto
            if(numeroSecreto === numeroUsuario){
            mostrarMensaje('¡Correcto! Adivinaste en ' + intentos + ' intentos🎉');
            } else if (numeroUsuario === numeroSecreto){
                mostrarMensaje('El numero Secreto es menor, Intenta de nuevo');
            }else{
                mostrarMensaje('El numero Secreto es mayor, Intent de nuevo');
            }
            //Limpiar la entrada para el siguiente intento
            document.getElementById('inputUsuario').value ='';
        }
        //Funcion mostrar mensaje
        function mostrarMensaje(texto){
            document.getElementById('mensaje').textContent = texto;
        }
